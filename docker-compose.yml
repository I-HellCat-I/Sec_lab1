services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab_db"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lab_db
      - SECRET_KEY=my_secure_jwt_key
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: