name: Security CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scans:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Установка Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.15'

      # 3. Установка зависимостей проекта и сканеров
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      # 4. SAST: Запуск Bandit (Поиск уязвимостей в коде Python)
      - name: Run SAST scanner (Bandit)
        run: |
          # Флаг -r рекурсивно проверяет папку, -ll показывает только средние и критические уязвимости
          bandit -r . -ll -ii

      # 5. SCA: Запуск Safety (Проверка зависимостей на известные CVE)
      - name: Run SCA scanner (Safety)
        run: |
          # Проверяет пакеты из requirements.txt по базам известных уязвимостей
          safety check -r requirements.txt